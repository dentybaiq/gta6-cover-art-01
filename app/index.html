<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="stage">
    <header class="brand">
      <h1>VICE COVER STUDIO</h1>
      <p>Your photo, a Vice City sunset, one shareable cover.</p>
    </header>
    <canvas id="preview" width="1080" height="1080" aria-label="Cover preview — click a panel to select it, drag to move its photo"></canvas>
    <p class="hint">Click a panel to select it · drag its photo to crop · drop a photo file on the cover</p>
  </section>
  <aside class="controls">
    <section>
      <h2>Layout</h2>
      <div id="layouts" class="row"></div>
    </section>
    <section>
      <h2>Grade</h2>
      <div id="presets" class="row"></div>
    </section>
    <section>
      <h2>Panels</h2>
      <div id="panels" class="column"></div>
      <p id="photoName" class="muted"></p>
      <div class="row wrap">
        <button id="sampleBoulevard" type="button">Boulevard sample</button>
        <button id="samplePier" type="button">Pier sample</button>
      </div>
      <label class="upload">Upload a photo <input id="upload" type="file" accept="image/*"></label>
      <div class="row wrap">
        <button id="applyAll" type="button">Use in all panels</button>
        <button id="clearPanel" type="button">Empty panel</button>
      </div>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1"> <span id="zoomVal">100%</span></label>
      <button id="resetCrop" type="button">Reset crop</button>
    </section>
    <section>
      <h2>Caption</h2>
      <label>Title <input id="title" type="text" maxlength="48" value="Boulevard Queen"></label>
      <label>Tagline <input id="subtitle" type="text" maxlength="48" value="Vice City nights"></label>
      <label>Title colour <span id="swatches" class="swatches"></span></label>
      <label>Title size <input id="titleSize" type="range" min="0.7" max="1.4" step="0.05" value="1"> <span id="titleSizeVal">100%</span></label>
      <label>Title position
        <select id="titlePos">
          <option value="bottom" selected>Bottom</option>
          <option value="top">Top</option>
        </select>
      </label>
    </section>
    <section>
      <h2>Export</h2>
      <div id="sizes" class="row"></div>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </section>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
